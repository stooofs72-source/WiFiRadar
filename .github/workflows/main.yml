
name: Build WiFiRadar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip WiFiRadar_Arabic_Project.zip -d extracted
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name gradlew -type f | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiRadar-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
